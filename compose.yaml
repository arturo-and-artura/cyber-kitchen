services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cyber_kitchen
      POSTGRES_USER: cyber_kitchen
      POSTGRES_PASSWORD: cyber_kitchen
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber_kitchen -d cyber_kitchen"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - cyber-kitchen-postgres:/var/lib/postgresql/data

volumes:
  cyber-kitchen-postgres:
